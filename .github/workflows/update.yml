name: Sync GKD subscription

on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 21 * * *'  # 05:30 Beijing, after the GKD daily rebuild

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install json5
        run: python -m pip install json5

      - name: Fetch and convert upstream rules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_gkd.py

      - name: Commit if changed
        run: |
          git config user.name "blockads-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dist/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "sync: gkd@$(date -u +%F)"
            git push
          fi
